services:
  infisical-agent:
    image: infisical/cli:<pin-version>
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "-c"]
    command:
      - |
        set -e
        test -n "$$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" && test -n "$$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" || { echo "Infisical Universal Auth credentials are required" >&2; exit 1; }
        umask 077
        printf '%s' "$$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" > /run/infisical-auth/client-id
        printf '%s' "$$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" > /run/infisical-auth/client-secret
        unset INFISICAL_UNIVERSAL_AUTH_CLIENT_ID INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
        exec /bin/infisical agent --config=/etc/infisical-agent/agent-config.yaml
    env_file:
      - .env.agent
    volumes:
      - ./infisical/agent-config.yaml:/etc/infisical-agent/agent-config.yaml:ro
      - ./infisical/templates/app.tpl:/templates/app.tpl:ro
      - shared_secrets:/shared-secrets
    tmpfs:
      - /run/infisical-auth:mode=0700
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >
          test -s /shared-secrets/.agent-token &&
          grep -qx '# render-complete' /shared-secrets/app.env
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

